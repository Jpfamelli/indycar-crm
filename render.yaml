# Deploy no Render — IndyCar CRM
#
# Este arquivo documenta a configuração esperada. Atenção: se o serviço for
# criado pela API (e não a partir deste blueprint), o Render IGNORA o arquivo
# e as variáveis precisam ser criadas à mão ou por Environment Group.
services:
  - type: web
    name: indycar-crm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ---- Banco: o mesmo Supabase do Atendimento e da Agenda ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # SEGREDO — ignora o RLS
      # Chave publicável: o navegador usa na tela de login (pública por design)
      - key: SUPABASE_ANON_KEY
        sync: false
      # Resumo semanal com IA (opcional)
      - key: ANTHROPIC_API_KEY
        sync: false
